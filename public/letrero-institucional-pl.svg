<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-labelledby="title desc">
  <title id="title">Servicios Especiales Pintado Londo&#241;o</title>
  <desc id="desc">Empresa de transporte especial de pasajeros</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#102f5e" />
      <stop offset="0.46" stop-color="#040b16" />
      <stop offset="1" stop-color="#133d30" />
    </linearGradient>
    <linearGradient id="silver" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.48" stop-color="#d9dde4" />
      <stop offset="1" stop-color="#8f99a8" />
    </linearGradient>
    <linearGradient id="green" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#b7f06f" />
      <stop offset="0.45" stop-color="#74c043" />
      <stop offset="1" stop-color="#3f7c22" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="880" height="360" rx="34" fill="url(#panel)" />
  <rect x="1" y="1" width="878" height="358" rx="33" fill="none" stroke="#d9dde4" stroke-opacity="0.16" />
  <circle cx="770" cy="70" r="190" fill="#74c043" opacity="0.11" />
  <circle cx="120" cy="320" r="170" fill="#06224b" opacity="0.42" />

  <g filter="url(#softShadow)">
    <text x="58" y="86" fill="#d9dde4" font-family="Sora, Manrope, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="13">
      SERVICIOS ESPECIALES
    </text>
    <text x="58" y="181" fill="url(#silver)" font-family="Sora, Manrope, Arial, sans-serif" font-size="88" font-weight="900" letter-spacing="-5">
      PINTADO
    </text>
    <text x="58" y="271" fill="url(#green)" font-family="Sora, Manrope, Arial, sans-serif" font-size="88" font-weight="900" letter-spacing="-5">
      LONDO&#209;O
    </text>
  </g>

  <g transform="translate(58 305)">
    <line x1="0" x2="130" y1="20" y2="20" stroke="#74c043" stroke-width="2" opacity="0.95" />
    <rect x="150" y="0" width="508" height="40" rx="20" fill="#040b16" stroke="#74c043" stroke-opacity="0.65" />
    <text x="404" y="26" text-anchor="middle" fill="#ffffff" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="1.2">
      EMPRESA DE TRANSPORTE ESPECIAL DE PASAJEROS
    </text>
    <line x1="678" x2="808" y1="20" y2="20" stroke="#e33239" stroke-width="2" opacity="0.95" />
  </g>
</svg>
